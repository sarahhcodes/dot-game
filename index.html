<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Peanut Pop</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #121212;
            color: #FFFFFF;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overscroll-behavior: none; 
            touch-action: none; 
        }

        #game-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 50px; 
            box-sizing: border-box;
            padding: 20px;
        }

        #ui-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
            width: 300px;
            height: 80%; 
            flex-shrink: 0;
        }

        #top-ui { text-align: center; }

        h1 {
            font-size: 2.8rem;
            margin: 0;
            color: #FFFFFF;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .stat-display {
            font-size: 2.2rem;
            font-weight: bold;
            margin-top: 10px;
        }

        #score-display { color: #FFDE00; }
        
        #highscore-display { 
            font-size: 1.6rem;
            color: #FF007F; 
            margin-top: 5px;
        }
        
        #moves-display { color: #00E5FF; margin-top: 15px; }

        #peanut-container {
            width: 180px;
            height: 180px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #peanut-character {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.1s; 
        }

        #game-board {
            position: relative;
            width: 690px;  
            height: 595px; 
            background-color: #1E1E1E;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            overflow: hidden; 
            flex-shrink: 0;
        }

        .dot {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset -6px -6px 12px rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.4);
            transition: top 0.4s ease-in-out, transform 0.2s ease-in;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px; 
        }
        .dot:active { transform: scale(0.9); }
        .dot.popped { transform: scale(0); }

        .color-0 { background-color: #FFDE00; } 
        .color-1 { background-color: #FF007F; } 
        .color-2 { background-color: #00E5FF; } 
        .color-3 { background-color: #39FF14; } 
        
        .item-starburst { 
            background-color: #FF5722; 
            box-shadow: inset -6px -6px 12px rgba(0,0,0,0.3), 0 0 15px #FF5722, 0 4px 10px rgba(0,0,0,0.4);
        }
        .item-acorn { 
            background-color: #795548; 
        }

        #game-over-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 20px;
            text-align: center;
        }

        #game-over-overlay h2 {
            font-size: 4rem;
            color: #39FF14; 
            margin: 0 0 20px 0;
            letter-spacing: 2px;
        }

        #game-over-overlay p {
            font-size: 2.5rem;
            color: #FFFFFF;
            margin: 0;
        }

        #reset-btn {
            padding: 25px 30px;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            background-color: #4A90E2;
            border: none;
            border-radius: 15px;
            box-shadow: 0 6px 0 #2A5A92;
            cursor: pointer;
            width: 100%;
        }
        #reset-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-panel">
            <div id="top-ui">
                <h1>PEANUT POP</h1>
                <div id="score-display" class="stat-display">Score: <span id="score">0</span></div>
                <div id="highscore-display" class="stat-display">Best: <span id="highscore">0</span></div>
                <div id="moves-display" class="stat-display">Moves: <span id="moves">30</span></div>
            </div>

            <div id="peanut-container">
                <img id="peanut-character" src="images/peanut-idle.png" alt="Happy Peanut Sidekick">
            </div>

            <button id="reset-btn" onclick="initGame()">New Game</button>
        </div>

        <div id="game-board">
            <div id="game-over-overlay">
                <h2>Great Job!</h2>
                <p>Final Score: <span id="final-score">0</span></p>
            </div>
        </div>
    </div>

    <script>
        const rows = 6;
        const cols = 7;
        const colors = 4;
        
        const dotSize = 80;
        const gap = 15;
        const padding = 20;
        
        const startingMoves = 30;

        let board = [];
        let score = 0;
        let moves = startingMoves;
        let isAnimating = false;
        let isGameOver = false;
        
        let highScore = localStorage.getItem('peanutPopHighScore') || 0;

        const boardElement = document.getElementById('game-board');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highscore');
        const movesElement = document.getElementById('moves');
        const overlayElement = document.getElementById('game-over-overlay');
        const finalScoreElement = document.getElementById('final-score');
        
        const peanutImg = document.getElementById('peanut-character');
        let currentBaseImage = 'images/peanut-idle.png';
        let jumpTimeout = null;

        function getLeftPos(col) { return padding + col * (dotSize + gap); }
        function getTopPos(row) { return padding + row * (dotSize + gap); }

        // Helper function to check what the base outfit should be
        function getBaseOutfit() {
            return score >= 500 ? 'images/peanut-r.png' : 'images/peanut-idle.png';
        }

        function triggerPeanutJump() {
            // Determine which jumping image to use based on the base outfit
            let jumpImage = 'images/peanut-jump.png';
            if (getBaseOutfit() === 'images/peanut-r.png') {
                jumpImage = 'images/peanut-r-jump.png';
            }
            
            peanutImg.src = jumpImage;
            
            if(jumpTimeout) clearTimeout(jumpTimeout);
            // After jumping, he lands in whatever his currentBaseImage is set to
            jumpTimeout = setTimeout(() => {
                peanutImg.src = currentBaseImage;
            }, 600);
        }

        function updateScore(points) {
            score += points;
            scoreElement.innerText = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('peanutPopHighScore', highScore);
                highScoreElement.innerText = highScore;
            }
            
            // If they pass 500 points on a normal move, give them the R shirt immediately
            if (score >= 500 && currentBaseImage === 'images/peanut-idle.png') {
                currentBaseImage = 'images/peanut-r.png';
                if (peanutImg.src.includes('peanut-idle.png')) {
                    peanutImg.src = currentBaseImage;
                }
            }
        }

        function generateDotElement(r, c) {
            let rand = Math.random();
            let type = 'color';
            let colorVal = null;
            
            if (rand < 0.05) type = 'starburst';
            else if (rand < 0.10) type = 'acorn';
            else {
                colorVal = Math.floor(Math.random() * colors);
            }

            let dot = document.createElement('div');
            dot.classList.add('dot');
            
            if (type === 'color') {
                dot.classList.add(`color-${colorVal}`);
            } else if (type === 'starburst') {
                dot.classList.add('item-starburst');
                dot.innerText = '⭐';
            } else if (type === 'acorn') {
                dot.classList.add('item-acorn');
                dot.innerText = '🌰';
            }

            dot.style.left = `${getLeftPos(c)}px`;
            dot.style.top = `${getTopPos(r)}px`;
            dot.dataset.row = r;
            dot.dataset.col = c;
            dot.addEventListener('pointerdown', handleTap); 
            
            boardElement.insertBefore(dot, overlayElement);
            return { type: type, color: colorVal, element: dot };
        }

        function initGame() {
            if (isAnimating) return;
            
            score = 0;
            moves = startingMoves;
            isGameOver = false;
            
            scoreElement.innerText = score;
            movesElement.innerText = moves;
            highScoreElement.innerText = highScore; 
            overlayElement.style.display = 'none';

            const oldDots = document.querySelectorAll('.dot');
            oldDots.forEach(dot => dot.remove());
            board = [];

            currentBaseImage = 'images/peanut-idle.png';
            peanutImg.src = currentBaseImage;

            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    let colorVal = Math.floor(Math.random() * colors);
                    let dot = document.createElement('div');
                    dot.classList.add('dot', `color-${colorVal}`);
                    dot.style.left = `${getLeftPos(c)}px`;
                    dot.style.top = `${getTopPos(r)}px`;
                    dot.dataset.row = r;
                    dot.dataset.col = c;
                    dot.addEventListener('pointerdown', handleTap); 
                    boardElement.insertBefore(dot, overlayElement);
                    row.push({ type: 'color', color: colorVal, element: dot });
                }
                board.push(row);
            }
        }

        function handleTap(e) {
            if (isAnimating || isGameOver) return; 

            const r = parseInt(e.currentTarget.dataset.row);
            const c = parseInt(e.currentTarget.dataset.col);
            
            if (!board[r][c]) return;
            
            const cellData = board[r][c];

            if (cellData.type === 'acorn') return;

            let matched = [];

            if (cellData.type === 'starburst') {
                for(let i=0; i<rows; i++) if(board[i][c]) matched.push({row: i, col: c});
                for(let j=0; j<cols; j++) if(board[r][j] && j !== c) matched.push({row: r, col: j});
                
            } 
            else if (cellData.type === 'color') {
                const color = cellData.color;
                let visited = Array(rows).fill().map(() => Array(cols).fill(false));

                function floodFill(row, col) {
                    if (row < 0 || row >= rows || col < 0 || col >= cols) return;
                    if (visited[row][col] || !board[row][col] || board[row][col].type !== 'color' || board[row][col].color !== color) return;

                    visited[row][col] = true;
                    matched.push({ row, col });

                    floodFill(row + 1, col);
                    floodFill(row - 1, col);
                    floodFill(row, col + 1);
                    floodFill(row, col - 1);
                }
                floodFill(r, c);
            }

            // Valid Move Executed
            if ((cellData.type === 'color' && matched.length >= 2) || cellData.type === 'starburst') {
                isAnimating = true;

                // 1. Revert any special costumes from the previous turn back to the base outfit
                currentBaseImage = getBaseOutfit();
                if (!peanutImg.src.includes('peanut-jump')) {
                    peanutImg.src = currentBaseImage;
                }
                
                // 2. If this turn is a starburst, set the outfit to Magician
                if (cellData.type === 'starburst') {
                     currentBaseImage = 'images/peanut-magician.png';
                }
                
                moves--;
                movesElement.innerText = moves;
                
                updateScore(matched.length * 10);

                if (matched.length >= 4 || cellData.type === 'starburst') {
                    triggerPeanutJump();
                }

                matched.forEach(dotInfo => {
                    const cell = board[dotInfo.row][dotInfo.col];
                    cell.element.classList.add('popped');
                    
                    setTimeout(() => {
                        if(cell.element.parentNode) {
                            cell.element.parentNode.removeChild(cell.element);
                        }
                    }, 200);

                    board[dotInfo.row][dotInfo.col] = null;
                });

                setTimeout(() => {
                    applyGravity();
                }, 200);
            }
        }

        function applyGravity() {
            for (let c = 0; c < cols; c++) {
                let emptySpaces = 0;
                
                for (let r = rows - 1; r >= 0; r--) {
                    if (board[r][c] === null) {
                        emptySpaces++;
                    } else if (emptySpaces > 0) {
                        board[r + emptySpaces][c] = board[r][c];
                        board[r][c] = null;
                        
                        let dotData = board[r + emptySpaces][c];
                        dotData.element.dataset.row = r + emptySpaces;
                        dotData.element.style.top = `${getTopPos(r + emptySpaces)}px`;
                    }
                }

                for (let r = 0; r < emptySpaces; r++) {
                    let newCellData = generateDotElement(r - emptySpaces, c);
                    board[r][c] = newCellData;
                    
                    void newCellData.element.offsetWidth; 
                    newCellData.element.dataset.row = r;
                    newCellData.element.style.top = `${getTopPos(r)}px`;
                }
            }

            setTimeout(checkAcornCollection, 400);
        }

        function checkAcornCollection() {
            let collected = false;
            
            for (let c = 0; c < cols; c++) {
                let bottomCell = board[rows - 1][c];
                if (bottomCell && bottomCell.type === 'acorn') {
                    collected = true;
                    
                    updateScore(100);
                    
                    // Gardener Trigger! Overwrites currentBaseImage for this turn
                    currentBaseImage = 'images/peanut-gardener.png';
                    
                    bottomCell.element.classList.add('popped');
                    setTimeout(() => {
                        if(bottomCell.element.parentNode) {
                            bottomCell.element.parentNode.removeChild(bottomCell.element);
                        }
                    }, 200);
                    
                    board[rows - 1][c] = null;
                }
            }

            if (collected) {
                triggerPeanutJump();
                setTimeout(() => {
                    applyGravity();
                }, 200);
            } else {
                isAnimating = false;
                
                if (moves <= 0) {
                    isGameOver = true;
                    finalScoreElement.innerText = score;
                    overlayElement.style.display = 'flex';
                }
            }
        }

        initGame();
    </script>
</body>
</html>
